<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숨겨진 성장의 백수 영웅 - 관리자 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #1a1a2e;
      padding: 20px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: #7c3aed;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2d2d44;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      margin-bottom: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: #a0a0a0;
    }

    .nav-item:hover, .nav-item.active {
      background: #2d2d44;
      color: #fff;
    }

    .nav-item i {
      width: 25px;
      margin-right: 10px;
    }

    /* Main Content */
    .main {
      flex: 1;
      margin-left: 250px;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #7c3aed;
      color: #fff;
    }

    .btn-primary:hover {
      background: #6d28d9;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1a1a2e;
      padding: 25px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-card.users::before { background: #3b82f6; }
    .stat-card.active::before { background: #10b981; }
    .stat-card.new::before { background: #f59e0b; }
    .stat-card.revenue::before { background: #ef4444; }
    .stat-card.saves::before { background: #8b5cf6; }
    .stat-card.purchases::before { background: #ec4899; }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #a0a0a0;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
    }

    .stat-card .icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      opacity: 0.1;
    }

    /* Tables */
    .card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #2d2d44;
    }

    th {
      color: #a0a0a0;
      font-weight: 500;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    tr:hover {
      background: #2d2d44;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-success { background: #10b98133; color: #10b981; }
    .badge-warning { background: #f59e0b33; color: #f59e0b; }
    .badge-danger { background: #ef444433; color: #ef4444; }
    .badge-info { background: #3b82f633; color: #3b82f6; }

    /* Activity Feed */
    .activity-item {
      display: flex;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #2d2d44;
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
    }

    .activity-icon.login { background: #3b82f633; color: #3b82f6; }
    .activity-icon.save { background: #10b98133; color: #10b981; }
    .activity-icon.purchase { background: #f59e0b33; color: #f59e0b; }

    .activity-content {
      flex: 1;
    }

    .activity-content strong {
      color: #fff;
    }

    .activity-time {
      font-size: 0.8rem;
      color: #666;
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      background: #0f0f23;
      color: #fff;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: #7c3aed;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 8px 15px;
      border: none;
      background: #2d2d44;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination button.active {
      background: #7c3aed;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      border: 3px solid #2d2d44;
      border-top: 3px solid #7c3aed;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Server Status */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .status-item {
      background: #0f0f23;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .status-item .label {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 5px;
    }

    .status-item .value {
      font-size: 1.1rem;
      font-weight: 500;
    }

    .status-online { color: #10b981; }
    .status-offline { color: #ef4444; }

    /* Hidden sections */
    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Auth */
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f0f23;
    }

    .auth-box {
      background: #1a1a2e;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
    }

    .auth-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #7c3aed;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #a0a0a0;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      background: #0f0f23;
      color: #fff;
    }

    .btn-block {
      width: 100%;
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-box">
      <h2><i class="fas fa-shield-alt"></i> 관리자 로그인</h2>
      <div class="form-group">
        <label>Admin Key</label>
        <input type="password" id="admin-key" placeholder="관리자 키를 입력하세요">
      </div>
      <button class="btn btn-primary btn-block" onclick="login()">로그인</button>
      <p id="auth-error" style="color: #ef4444; margin-top: 15px; text-align: center; display: none;"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display: none;">
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <i class="fas fa-gamepad"></i> 백수 영웅 Admin
        </div>
        <nav>
          <div class="nav-item active" data-section="overview">
            <i class="fas fa-chart-line"></i> 대시보드
          </div>
          <div class="nav-item" data-section="users">
            <i class="fas fa-users"></i> 유저 관리
          </div>
          <div class="nav-item" data-section="rankings">
            <i class="fas fa-trophy"></i> 랭킹
          </div>
          <div class="nav-item" data-section="activities">
            <i class="fas fa-history"></i> 활동 로그
          </div>
          <div class="nav-item" data-section="server">
            <i class="fas fa-server"></i> 서버 상태
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <!-- Overview Section -->
        <section id="overview" class="section active">
          <div class="header">
            <h1>대시보드</h1>
            <div class="header-actions">
              <button class="btn btn-primary" onclick="refreshStats()">
                <i class="fas fa-sync-alt"></i> 새로고침
              </button>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card users">
              <h3>전체 유저</h3>
              <div class="value" id="stat-total-users">-</div>
              <i class="fas fa-users icon"></i>
            </div>
            <div class="stat-card active">
              <h3>오늘 활성 유저</h3>
              <div class="value" id="stat-active-users">-</div>
              <i class="fas fa-user-check icon"></i>
            </div>
            <div class="stat-card new">
              <h3>오늘 신규 가입</h3>
              <div class="value" id="stat-new-users">-</div>
              <i class="fas fa-user-plus icon"></i>
            </div>
            <div class="stat-card revenue">
              <h3>총 매출</h3>
              <div class="value" id="stat-revenue">-</div>
              <i class="fas fa-dollar-sign icon"></i>
            </div>
            <div class="stat-card saves">
              <h3>총 세이브</h3>
              <div class="value" id="stat-saves">-</div>
              <i class="fas fa-save icon"></i>
            </div>
            <div class="stat-card purchases">
              <h3>총 구매</h3>
              <div class="value" id="stat-purchases">-</div>
              <i class="fas fa-shopping-cart icon"></i>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">최근 활동</h3>
            </div>
            <div id="recent-activities">
              <div class="loading">
                <div class="spinner"></div>
                로딩 중...
              </div>
            </div>
          </div>
        </section>

        <!-- Users Section -->
        <section id="users" class="section">
          <div class="header">
            <h1>유저 관리</h1>
          </div>

          <div class="card">
            <div class="search-box">
              <input type="text" id="user-search" placeholder="유저명 또는 이메일 검색...">
              <button class="btn btn-primary" onclick="searchUsers()">
                <i class="fas fa-search"></i> 검색
              </button>
            </div>
            <table>
              <thead>
                <tr>
                  <th>유저명</th>
                  <th>이메일</th>
                  <th>가입 방법</th>
                  <th>가입일</th>
                  <th>마지막 로그인</th>
                  <th>구매</th>
                  <th>액션</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
              </tbody>
            </table>
            <div class="pagination" id="users-pagination"></div>
          </div>
        </section>

        <!-- Rankings Section -->
        <section id="rankings" class="section">
          <div class="header">
            <h1>랭킹</h1>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">랭킹 타입</h3>
              <select id="ranking-type" class="btn" style="background: #2d2d44; color: #fff; padding: 10px;">
                <option value="power">전투력</option>
                <option value="gold">골드</option>
                <option value="stage">스테이지</option>
              </select>
            </div>
            <table>
              <thead>
                <tr>
                  <th>순위</th>
                  <th>유저명</th>
                  <th>점수</th>
                </tr>
              </thead>
              <tbody id="rankings-table-body">
              </tbody>
            </table>
          </div>
        </section>

        <!-- Activities Section -->
        <section id="activities" class="section">
          <div class="header">
            <h1>활동 로그</h1>
            <button class="btn btn-primary" onclick="loadActivities()">
              <i class="fas fa-sync-alt"></i> 새로고침
            </button>
          </div>

          <div class="card">
            <div id="activities-list">
              <div class="loading">
                <div class="spinner"></div>
                로딩 중...
              </div>
            </div>
          </div>
        </section>

        <!-- Server Section -->
        <section id="server" class="section">
          <div class="header">
            <h1>서버 상태</h1>
            <button class="btn btn-primary" onclick="loadServerStatus()">
              <i class="fas fa-sync-alt"></i> 새로고침
            </button>
          </div>

          <div class="card">
            <div class="status-grid" id="server-status">
              <div class="loading">
                <div class="spinner"></div>
                로딩 중...
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- User Detail Modal -->
  <div class="modal" id="user-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>유저 상세 정보</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="user-detail-content"></div>
    </div>
  </div>

  <script>
    let adminKey = '';
    const API_BASE = '/api/v1/admin';
    let currentUsersPage = 1;

    // Auth
    async function login() {
      const key = document.getElementById('admin-key').value;
      if (!key) {
        showAuthError('관리자 키를 입력하세요');
        return;
      }

      adminKey = key;

      try {
        const response = await fetch(`${API_BASE}/stats`, {
          headers: { 'X-Admin-Key': adminKey }
        });

        if (response.ok) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          localStorage.setItem('adminKey', adminKey);
          loadDashboard();
        } else {
          showAuthError('잘못된 관리자 키입니다');
        }
      } catch (error) {
        showAuthError('서버 연결 실패');
      }
    }

    function showAuthError(message) {
      const error = document.getElementById('auth-error');
      error.textContent = message;
      error.style.display = 'block';
    }

    // Check saved key
    window.onload = function() {
      const savedKey = localStorage.getItem('adminKey');
      if (savedKey) {
        document.getElementById('admin-key').value = savedKey;
        login();
      }
    };

    // API Helper
    async function apiCall(endpoint) {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        headers: { 'X-Admin-Key': adminKey }
      });
      return response.json();
    }

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const section = item.dataset.section;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(section).classList.add('active');

        // Load section data
        if (section === 'overview') loadDashboard();
        else if (section === 'users') loadUsers();
        else if (section === 'rankings') loadRankings();
        else if (section === 'activities') loadActivities();
        else if (section === 'server') loadServerStatus();
      });
    });

    // Dashboard
    async function loadDashboard() {
      await Promise.all([refreshStats(), loadRecentActivities()]);
    }

    async function refreshStats() {
      try {
        const result = await apiCall('/stats');
        if (result.success) {
          const data = result.data;
          document.getElementById('stat-total-users').textContent = numberFormat(data.totalUsers);
          document.getElementById('stat-active-users').textContent = numberFormat(data.activeUsersToday);
          document.getElementById('stat-new-users').textContent = numberFormat(data.newUsersToday);
          document.getElementById('stat-revenue').textContent = '$' + numberFormat(data.totalRevenue);
          document.getElementById('stat-saves').textContent = numberFormat(data.totalSaves);
          document.getElementById('stat-purchases').textContent = numberFormat(data.totalPurchases);
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function loadRecentActivities() {
      try {
        const result = await apiCall('/activities?limit=10');
        if (result.success) {
          const container = document.getElementById('recent-activities');
          if (result.data.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666;">활동 내역이 없습니다.</p>';
            return;
          }
          container.innerHTML = result.data.map(activity => `
            <div class="activity-item">
              <div class="activity-icon ${activity.type}">
                <i class="fas fa-${getActivityIcon(activity.type)}"></i>
              </div>
              <div class="activity-content">
                <strong>${activity.username}</strong>님이 ${activity.details}
              </div>
              <div class="activity-time">${formatTime(activity.timestamp)}</div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Failed to load activities:', error);
      }
    }

    // Users
    async function loadUsers(page = 1) {
      currentUsersPage = page;
      const search = document.getElementById('user-search').value;
      try {
        const result = await apiCall(`/users?page=${page}&limit=15&search=${encodeURIComponent(search)}`);
        if (result.success) {
          const tbody = document.getElementById('users-table-body');
          tbody.innerHTML = result.data.users.map(user => `
            <tr>
              <td>${user.username}</td>
              <td>${user.email || '-'}</td>
              <td><span class="badge badge-info">${user.provider}</span></td>
              <td>${formatDate(user.created_at)}</td>
              <td>${user.last_login ? formatTime(user.last_login) : '-'}</td>
              <td>${user.purchase_count}</td>
              <td>
                <button class="btn" style="padding: 5px 10px; font-size: 0.8rem;" onclick="viewUser('${user.id}')">
                  <i class="fas fa-eye"></i>
                </button>
              </td>
            </tr>
          `).join('');

          // Pagination
          renderPagination('users-pagination', result.data.page, result.data.totalPages, loadUsers);
        }
      } catch (error) {
        console.error('Failed to load users:', error);
      }
    }

    function searchUsers() {
      loadUsers(1);
    }

    async function viewUser(userId) {
      try {
        const result = await apiCall(`/users/${userId}`);
        if (result.success) {
          const user = result.data;
          document.getElementById('user-detail-content').innerHTML = `
            <div style="margin-bottom: 20px;">
              <p><strong>ID:</strong> ${user.id}</p>
              <p><strong>유저명:</strong> ${user.username}</p>
              <p><strong>이메일:</strong> ${user.email || '-'}</p>
              <p><strong>가입 방법:</strong> ${user.provider}</p>
              <p><strong>가입일:</strong> ${formatDate(user.created_at)}</p>
            </div>
            <h4 style="margin-bottom: 10px;">세이브 데이터</h4>
            ${user.saves.length > 0 ? `
              <table style="margin-bottom: 20px;">
                <thead>
                  <tr><th>슬롯</th><th>골드</th><th>스테이지</th><th>전투력</th><th>저장일</th></tr>
                </thead>
                <tbody>
                  ${user.saves.map(s => `
                    <tr>
                      <td>${s.slot}</td>
                      <td>${s.gold || '-'}</td>
                      <td>${s.stage || '-'}</td>
                      <td>${s.power || '-'}</td>
                      <td>${formatTime(s.updated_at)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<p style="color: #666;">세이브 데이터가 없습니다.</p>'}
            <h4 style="margin-bottom: 10px;">구매 내역</h4>
            ${user.purchases.length > 0 ? `
              <table>
                <thead>
                  <tr><th>상품</th><th>금액</th><th>상태</th><th>날짜</th></tr>
                </thead>
                <tbody>
                  ${user.purchases.map(p => `
                    <tr>
                      <td>${p.product_id}</td>
                      <td>$${p.amount}</td>
                      <td><span class="badge badge-${p.status === 'completed' ? 'success' : 'warning'}">${p.status}</span></td>
                      <td>${formatTime(p.created_at)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<p style="color: #666;">구매 내역이 없습니다.</p>'}
          `;
          document.getElementById('user-modal').classList.add('active');
        }
      } catch (error) {
        console.error('Failed to load user:', error);
      }
    }

    function closeModal() {
      document.getElementById('user-modal').classList.remove('active');
    }

    // Rankings
    async function loadRankings() {
      const type = document.getElementById('ranking-type').value;
      try {
        const result = await apiCall(`/rankings/${type}?limit=100`);
        if (result.success) {
          const tbody = document.getElementById('rankings-table-body');
          tbody.innerHTML = result.data.map(item => `
            <tr>
              <td>
                ${item.rank <= 3 ? `<span style="color: ${['#ffd700', '#c0c0c0', '#cd7f32'][item.rank - 1]}">
                  <i class="fas fa-trophy"></i> ${item.rank}
                </span>` : item.rank}
              </td>
              <td>${item.username}</td>
              <td>${numberFormat(item.score)}</td>
            </tr>
          `).join('');
        }
      } catch (error) {
        console.error('Failed to load rankings:', error);
      }
    }

    document.getElementById('ranking-type').addEventListener('change', loadRankings);

    // Activities
    async function loadActivities() {
      try {
        const result = await apiCall('/activities?limit=100');
        if (result.success) {
          const container = document.getElementById('activities-list');
          container.innerHTML = result.data.map(activity => `
            <div class="activity-item">
              <div class="activity-icon ${activity.type}">
                <i class="fas fa-${getActivityIcon(activity.type)}"></i>
              </div>
              <div class="activity-content">
                <strong>${activity.username}</strong>님이 ${activity.details}
              </div>
              <div class="activity-time">${formatTime(activity.timestamp)}</div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Failed to load activities:', error);
      }
    }

    // Server Status
    async function loadServerStatus() {
      try {
        const result = await apiCall('/server/status');
        if (result.success) {
          const data = result.data;
          const container = document.getElementById('server-status');
          container.innerHTML = `
            <div class="status-item">
              <div class="label">Database</div>
              <div class="value ${data.database === 'connected' ? 'status-online' : 'status-offline'}">
                <i class="fas fa-${data.database === 'connected' ? 'check-circle' : 'times-circle'}"></i>
                ${data.database}
              </div>
            </div>
            <div class="status-item">
              <div class="label">Redis</div>
              <div class="value ${data.redis === 'connected' ? 'status-online' : 'status-offline'}">
                <i class="fas fa-${data.redis === 'connected' ? 'check-circle' : 'times-circle'}"></i>
                ${data.redis}
              </div>
            </div>
            <div class="status-item">
              <div class="label">Uptime</div>
              <div class="value">${formatUptime(data.uptime)}</div>
            </div>
            <div class="status-item">
              <div class="label">Memory (Heap)</div>
              <div class="value">${formatBytes(data.memory.heapUsed)}</div>
            </div>
            <div class="status-item">
              <div class="label">Node Version</div>
              <div class="value">${data.nodeVersion}</div>
            </div>
          `;
        }
      } catch (error) {
        console.error('Failed to load server status:', error);
      }
    }

    // Helpers
    function numberFormat(num) {
      return new Intl.NumberFormat().format(num);
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('ko-KR');
    }

    function formatTime(date) {
      const d = new Date(date);
      const now = new Date();
      const diff = now - d;

      if (diff < 60000) return '방금 전';
      if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
      return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    function formatUptime(seconds) {
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (days > 0) return `${days}일 ${hours}시간`;
      if (hours > 0) return `${hours}시간 ${minutes}분`;
      return `${minutes}분`;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getActivityIcon(type) {
      const icons = { login: 'sign-in-alt', save: 'save', purchase: 'shopping-cart', register: 'user-plus' };
      return icons[type] || 'circle';
    }

    function renderPagination(containerId, current, total, callback) {
      const container = document.getElementById(containerId);
      let html = '';

      if (total <= 1) {
        container.innerHTML = '';
        return;
      }

      if (current > 1) {
        html += `<button onclick="${callback.name}(${current - 1})"><i class="fas fa-chevron-left"></i></button>`;
      }

      for (let i = Math.max(1, current - 2); i <= Math.min(total, current + 2); i++) {
        html += `<button class="${i === current ? 'active' : ''}" onclick="${callback.name}(${i})">${i}</button>`;
      }

      if (current < total) {
        html += `<button onclick="${callback.name}(${current + 1})"><i class="fas fa-chevron-right"></i></button>`;
      }

      container.innerHTML = html;
    }

    // Enter key for login
    document.getElementById('admin-key').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    // Enter key for search
    document.getElementById('user-search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchUsers();
    });
  </script>
</body>
</html>
