version: '3.8'

# Development override - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: .
      target: builder  # Use builder stage for development
    volumes:
      - ./src:/app/src:ro  # Mount source for hot reload
      - ./package.json:/app/package.json:ro
    command: npm run dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug

  postgres:
    ports:
      - "5432:5432"  # Expose for local tools

  redis:
    ports:
      - "6379:6379"  # Expose for local tools

  # Adminer for database management (dev only)
  adminer:
    image: adminer
    container_name: hidden-growth-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - backend-network

  # Redis Commander for cache management (dev only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hidden-growth-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - backend-network
